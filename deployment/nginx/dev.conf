# ============================================================================
# PAKTON Development Nginx Configuration (dev.pakton.site)
# ============================================================================
# 
# This file contains configuration snippets for DEVELOPMENT environment
# to add to your EXISTING Nginx installation on the EC2 host.
#
# Development will run on: https://dev.pakton.site
# Services will use ports: 5002 (API), 3001 (Frontend), 15672 (RabbitMQ)
#
# Note: You need to update deploy-dev.sh to use different ports (5002, 3001)
#       to avoid conflicts with production (5001, 3000)
#
# Author: Raptopoulos Petros [petrosrapto@gmail.com]
# Date  : 2025/11/24
# ============================================================================

# ----------------------------------------------------------------------------
# 1. ADD TO: /etc/nginx/nginx.conf (inside the http {} block)
# ----------------------------------------------------------------------------
# http {
#     # Development rate limiting (more relaxed than production)
#     limit_req_zone $binary_remote_addr zone=dev_api_limit:10m rate=30r/s;
#     limit_req_zone $binary_remote_addr zone=dev_frontend_limit:10m rate=100r/s;
# }

# ----------------------------------------------------------------------------
# 2. UPSTREAM DEFINITIONS (add at top of server config file)
# ----------------------------------------------------------------------------

upstream pakton_dev_api {
    server localhost:5002;
}

upstream pakton_dev_frontend {
    server localhost:3001;
}

upstream pakton_dev_rabbitmq {
    server localhost:15672;
}

# ----------------------------------------------------------------------------
# 3. CREATE NEW SERVER BLOCK - Development (dev.pakton.site)
# ----------------------------------------------------------------------------
# Create file: /etc/nginx/sites-available/dev.pakton.site
# Then symlink: sudo ln -s /etc/nginx/sites-available/dev.pakton.site /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name dev.pakton.site;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dev.pakton.site;

    # SSL Configuration (will be auto-configured by certbot)
    # ssl_certificate /etc/letsencrypt/live/dev.pakton.site/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dev.pakton.site/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/dev.pakton.site.access.log;
    error_log /var/log/nginx/dev.pakton.site.error.log;

    # PAKTON Dev API
    location /api/ {
        limit_req zone=dev_api_limit burst=50 nodelay;
        
        rewrite ^/api/(.*) /$1 break;
        
        proxy_pass http://pakton_dev_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE/Streaming support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;  # Longer timeout for dev
        proxy_connect_timeout 75s;
        proxy_send_timeout 600s;
        
        # CORS - permissive for development
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # PAKTON Dev Frontend (ROOT)
    location / {
        limit_req zone=dev_frontend_limit burst=100 nodelay;
        
        proxy_pass http://pakton_dev_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 600s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 600s;
    }

    # RabbitMQ Management UI (Development only)
    location /rabbitmq/ {
        # Optional: Add basic auth for security
        # auth_basic "RabbitMQ Management";
        # auth_basic_user_file /etc/nginx/.htpasswd;
        
        rewrite ^/rabbitmq/(.*) /$1 break;
        proxy_pass http://pakton_dev_rabbitmq;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "dev-healthy\n";
        add_header Content-Type text/plain;
    }
}

# ----------------------------------------------------------------------------
# SETUP INSTRUCTIONS
# ----------------------------------------------------------------------------
#
# 1. Set up DNS for dev.pakton.site:
#    - Add A record: dev.pakton.site -> Your EC2 IP
#
# 2. Create Nginx site config:
#    sudo nano /etc/nginx/sites-available/dev.pakton.site
#    (Copy the server blocks above)
#
# 3. Enable the site:
#    sudo ln -s /etc/nginx/sites-available/dev.pakton.site /etc/nginx/sites-enabled/
#
# 4. Get SSL certificate:
#    sudo certbot --nginx -d dev.pakton.site
#
# 5. Update deploy-dev.sh to use ports 5002 (API) and 3001 (Frontend)
#
# 6. Test and reload:
#    sudo nginx -t
#    sudo systemctl reload nginx
#
# ----------------------------------------------------------------------------
