# ============================================================================
# PAKTON Production Nginx Configuration (pakton.site)
# ============================================================================
# 
# This file contains configuration snippets for PRODUCTION environment
# to add to your EXISTING Nginx installation on the EC2 host.
#
# Production will run on: https://pakton.site
# Services will use ports: 5001 (API), 3000 (Frontend)
#
# Author: Raptopoulos Petros [petrosrapto@gmail.com]
# Date  : 2025/11/24
# ============================================================================

# ----------------------------------------------------------------------------
# 1. ADD TO: /etc/nginx/nginx.conf (inside the http {} block)
# ----------------------------------------------------------------------------
# http {
#     # Production rate limiting (stricter than dev)
#     limit_req_zone $binary_remote_addr zone=prod_api_limit:10m rate=10r/s;
#     limit_req_zone $binary_remote_addr zone=prod_frontend_limit:10m rate=30r/s;
# }

# ----------------------------------------------------------------------------
# 2. UPSTREAM DEFINITIONS (add at top of server config file)
# ----------------------------------------------------------------------------

upstream pakton_prod_api {
    server localhost:5001;
    keepalive 32;
}

upstream pakton_prod_frontend {
    server localhost:3000;
    keepalive 32;
}

# ----------------------------------------------------------------------------
# 3. SERVER BLOCK - Production (pakton.site)
# ----------------------------------------------------------------------------
# Add these locations to your existing HTTPS server block for pakton.site

    # PAKTON Production API
    location /api/ {
        limit_req zone=prod_api_limit burst=20 nodelay;
        
        rewrite ^/api/(.*) /$1 break;
        
        proxy_pass http://pakton_prod_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE/Streaming support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        
        # CORS (consider restricting in production)
        add_header 'Access-Control-Allow-Origin' 'https://pakton.site' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://pakton.site';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # Old Streamlit Frontend (moved from root)
    location /old/ {
        proxy_pass http://localhost:8501/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PAKTON Production Frontend (ROOT)
    location / {
        limit_req zone=prod_frontend_limit burst=50 nodelay;
        
        proxy_pass http://pakton_prod_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
